# Taxi Na Biso — Nginx (VPS)
# Deux processus Node locaux, aucun port public.
# Web  : 127.0.0.1:3001
# Admin: 127.0.0.1:3000
#
# Certificats : sudo certbot --nginx -d taxinabiso.newsystemcorps.com -d admin.taxinabiso.newsystemcorps.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream taxinabiso_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream taxinabiso_admin {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name taxinabiso.newsystemcorps.com admin.taxinabiso.newsystemcorps.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taxinabiso.newsystemcorps.com;

    # ssl_certificate     /etc/letsencrypt/live/taxinabiso.newsystemcorps.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/taxinabiso.newsystemcorps.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://taxinabiso_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.taxinabiso.newsystemcorps.com;

    # ssl_certificate     /etc/letsencrypt/live/taxinabiso.newsystemcorps.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/taxinabiso.newsystemcorps.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://taxinabiso_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
